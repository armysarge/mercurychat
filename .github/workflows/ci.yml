# Not yet run: the project has no Git remote. Mirrors the M0 local checks.
name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Linux WebKitGTK deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libxdo-dev
      - name: Build UI
        run: npm --prefix apps/desktop ci && npm --prefix apps/desktop run build
      - name: Rust tests (protocol vectors, adapter, storage, core, L0 scenario)
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
