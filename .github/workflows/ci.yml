# The check gate (scripts/check.sh) on every push and pull request. Actions are
# pinned by commit; the token can only read the repository.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Linux WebKitGTK deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libxdo-dev
      - name: Install UI dependencies
        run: npm --prefix apps/desktop ci
      - name: Check gate (fmt, clippy, tests, UI build)
        shell: bash
        run: bash scripts/check.sh
