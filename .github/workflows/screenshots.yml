# Screenshots of the real Windows app on its simulator (demo callsign N0CALL),
# for the README. Started by hand: Actions -> screenshots -> Run workflow.
# The PNGs come out as the "screenshots" artifact.
name: screenshots
on: workflow_dispatch
permissions:
  contents: read
jobs:
  shoot:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Install UI dependencies
        run: npm --prefix apps/desktop ci
      - name: Build the UI
        run: npm --prefix apps/desktop run build
      - name: Build the app (debug, with the simulator)
        run: cargo build -p mercurychat --features tauri/custom-protocol
      # The runner is elevated, where WebView2 can ignore the environment variable
      # the script uses for its DevTools port, so set it as a machine policy too.
      # This is a throwaway machine; 9371 is the script's port.
      - name: Open the WebView2 DevTools port for the app
        run: |
          $key = "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name "mercurychat.exe" -Value "--remote-debugging-port=9371" -PropertyType String -Force | Out-Null
      - name: Take the screenshots
        run: node scripts/screenshots.mjs target/debug/mercurychat.exe shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn
          retention-days: 14
