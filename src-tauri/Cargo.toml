[package]
name = "mercurychat"
description = "MercuryChat desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mercurychat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Desktop notifications (M3a Task 12b), pinned.
tauri-plugin-notification = "=2.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
mc-storage = { path = "../crates/mc-storage" }
mc-core = { path = "../crates/mc-core" }
tracing = "0.1"
thiserror = "2"
mch-protocol = { path = "../crates/mch-protocol" }
mercury-adapter = { path = "../crates/mercury-adapter", default-features = false }
# The file picker for Send file (M4), pinned; only `open` is allowed (capabilities).
tauri-plugin-dialog = "=2.8.4"

[features]
# The simulator (fake Mercury pair, SIM1) for development, tests, the window
# checks and screenshots. Release and installer builds leave it out
# (`--no-default-features`, M5 §5.6).
default = ["simulator"]
simulator = ["mc-core/sim"]
# The webview inspector. Never default and never in a release build: the shell
# builds without it, F12 and the default context menu are also inert in the UI.
devtools = ["tauri/devtools"]

[dev-dependencies]
tempfile = "3"
# The spectrum forwarder's test runs on a paused clock.
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "test-util"] }
