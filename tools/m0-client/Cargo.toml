[package]
name = "m0-client"
description = "MercuryChat M0 modem-integration test client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mc-core = { path = "../../crates/mc-core", features = ["sim"] }
mc-storage = { path = "../../crates/mc-storage" }
mch-protocol = { path = "../../crates/mch-protocol" }
mercury-adapter = { path = "../../crates/mercury-adapter", features = ["fake"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
