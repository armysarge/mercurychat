[package]
name = "mercury-contract"
description = "The Mercury contract suite: one set of tests against the fake and against real Mercury (M3c Part A)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
mercury-adapter = { path = "../mercury-adapter", features = ["fake"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

[dev-dependencies]
mch-protocol = { path = "../mch-protocol" }
# M4: the file contracts run MercuryChat's own session engine over the target.
mc-core = { path = "../mc-core" }
tempfile = "3"
sha2 = "0.10"
hex = "0.4"

[[test]]
name = "contracts"
path = "tests/contracts/main.rs"
