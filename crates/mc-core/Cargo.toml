[package]
name = "mc-core"
description = "MercuryChat station and MCH/1 session engine (headless)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
ts-rs = "12"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mch-protocol = { path = "../mch-protocol" }
mercury-adapter = { path = "../mercury-adapter", default-features = false }
mc-storage = { path = "../mc-storage" }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros", "fs"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

[dev-dependencies]
futures = "0.3"
filetime = "0.2"
mercury-adapter = { path = "../mercury-adapter", features = ["fake"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
