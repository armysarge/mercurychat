[package]
name = "mc-core"
description = "MercuryChat station and MCH/1 session engine (headless)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The in-process simulator modem (fake Mercury pair) for UI work without RF.
sim = ["mercury-adapter/fake"]
# Arbitrary-payload test hooks (AppHandle::send_beacon_payload). Never enable this
# from a shipped crate: only the self dev-dependency below turns it on, and
# scripts/check.sh fails if src-tauri or tools name it.
test-hooks = []

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
ts-rs = "12"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mch-protocol = { path = "../mch-protocol" }
mercury-adapter = { path = "../mercury-adapter", default-features = false }
mc-storage = { path = "../mc-storage" }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros", "fs"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

[dev-dependencies]
mc-core = { path = ".", features = ["test-hooks"] }
futures = "0.3"
filetime = "0.2"
mercury-adapter = { path = "../mercury-adapter", features = ["fake"] }
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
# Same version as mc-storage: lets a test break the peer's store on purpose.
rusqlite = { version = "0.37", features = ["bundled"] }
