[package]
name = "mercury-adapter"
description = "Headless Mercury TNC control/data adapter and fake modem harness"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["fake"]
# Deterministic fake Mercury pair for L0 tests and the M0 client's self-test.
fake = ["dep:rand"]

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros", "process"] }
thiserror = "2"
rand = { version = "0.9", optional = true }
serde_json = "1"
# Mercury's telemetry WebSocket: a plain ws:// client (and, under `fake`, the
# test server). No TLS: Mercury's wss:// is not supported.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

# A stand-in for Hamlib's rigctld (FakeRigctld behind rigctld's flags), for the
# supervisor's tests (M3b.1 Task 3).
[[bin]]
name = "fake-rigctld"
path = "src/bin/fake_rigctld.rs"
required-features = ["fake"]

# A stand-in for Mercury behind its flags, for the built-in modem's supervisor
# tests (M5 Task 4).
[[bin]]
name = "fake-mercury"
path = "src/bin/fake_mercury.rs"
required-features = ["fake"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
